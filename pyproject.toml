[project]
name = "mmt-micromagnetic-demag-signature"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.64.0",
    "numpy>=2.4.4",
]

[project.optional-dependencies]
# GPU backend for compute_scan_signal(method="cutile"). Requires CUDA 13.x
# at runtime. For CUDA 12.x systems, install `cupy-cuda12x` manually instead
# of the cu13 wheel pinned here.
cutile = [
    "cuda-tile[tileiras]",
    "cupy-cuda13x",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
]

[build-system]
requires = ["scikit-build-core", "cython", "numpy"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["mmt_micromagnetic_demag_signature"]
